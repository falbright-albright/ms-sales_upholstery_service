[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Security headers
# Kept conservative (no strict CSP) since next/font and next/og (used for the
# favicon/social-preview images) rely on standard Next.js asset pipelines.
# Tighten further once real analytics/embed scripts are finalized.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Netlify Forms
# ---------------------------------------------------------------------------
# No redirects/functions needed here: the "quote-request" and "contact"
# forms are detected automatically at deploy time from the static HTML
# Next.js prerenders for /free-estimate and /contact (see QuoteForm.tsx and
# ContactForm.tsx for the detection requirements). Submissions appear under
# Site configuration → Forms in the Netlify dashboard; set up email
# notifications there so M.S. is alerted for every new lead.
